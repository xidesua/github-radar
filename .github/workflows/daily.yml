name: 每日情报站

# 每天北京时间 9:00 自动跑一次，生成当日榜单并发布成网页。
# 想在电脑关机时也能跑，就靠这个文件。

on:
  schedule:
    - cron: "0 1 * * *"      # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write            # 把生成结果提交回仓库
  pages: write               # 发布网页
  id-token: write

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并生成日报
        env:
          # 用仓库自带的 token，搜索接口的额度更高（30 次/分钟）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data digest.md
          if git diff --cached --quiet; then
            echo "内容没变化，跳过提交"
          else
            git commit -m "chore: 情报站 $(date -u +%F)"
            git push
          fi

      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
